name: Build and Release CXVideoCutter

# 一次触发构建三端产物并发布 Release v1.0.2：
#   - Windows x64          CXVideoCutter-v1.0.2-win-x64.exe
#   - Windows ARM64        CXVideoCutter-v1.0.2-win-arm64.exe（交叉冻结，内嵌全 ARM64 二进制）
#   - macOS Apple Silicon  CXVideoCutter.app -> CXVideoCutter-v1.0.2-macos-arm64.zip
on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  windows-x64:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "PySide6==6.12.0" "PyInstaller==6.22.3"
      - name: Build x64 EXE
        shell: bash
        run: |
          mkdir -p dist-win-x64 build-win-x64
          python -m PyInstaller --noconfirm --clean \
            --distpath dist-win-x64 --workpath build-win-x64 \
            build_tools/windows/build_x64.spec
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist-win-x64/CXVideoCutter-v1.0.2-win-x64.exe
          if-no-files-found: error

  windows-arm64:
    name: Windows ARM64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install x64 analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "PySide6==6.12.0" "PyInstaller==6.22.3"
      - name: Download ARM64 wheels and Python runtime
        shell: bash
        run: |
          mkdir -p build_tools/arm64/downloads
          python -m pip download --no-deps --platform win_arm64 --python-version 3.13 \
            --only-binary=:all: --dest build_tools/arm64/downloads \
            "PySide6==6.12.0" "PySide6-Essentials==6.12.0" "PySide6-Addons==6.12.0" \
            "shiboken6==6.12.0" "PyInstaller==6.22.3"
          curl -L --fail --retry 2 \
            -o build_tools/arm64/downloads/python-3.13.14-embed-arm64.zip \
            https://www.python.org/ftp/python/3.13.14/python-3.13.14-embed-arm64.zip
      - name: Unpack ARM64 assets
        run: python build_tools/arm64/prepare_assets.py
      - name: Cross-freeze ARM64 EXE
        run: python build_tools/arm64/build_arm64_exe.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-arm64
          path: build_tools/arm64/dist/CXVideoCutter-v1.0.2-win-arm64.exe
          if-no-files-found: error

  macos-arm64:
    name: macOS Apple Silicon
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build .app bundle
        run: bash build_tools/macos/build_macos_app.sh
      - name: Zip app bundle
        run: cd dist && zip -ry CXVideoCutter-v1.0.2-macos-arm64.zip CXVideoCutter.app
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/CXVideoCutter-v1.0.2-macos-arm64.zip
          if-no-files-found: error

  release:
    name: Publish Release v1.0.2
    needs: [windows-x64, windows-arm64, macos-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          name: v1.0.2
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/windows-x64/CXVideoCutter-v1.0.2-win-x64.exe
            artifacts/windows-arm64/CXVideoCutter-v1.0.2-win-arm64.exe
            artifacts/macos-arm64/CXVideoCutter-v1.0.2-macos-arm64.zip
      # v1.0.2 的资产名带版本号，不会被下面的前缀匹配误删。
      - name: Remove legacy release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/releases/tags/v1.0.2" \
            --jq '.assets[] | select(.name | startswith("CXVideoCutter-win-") or startswith("CXVideoCutter-macos-")) | .id' \
          | while read -r id; do
              [ -n "$id" ] && gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$id"
            done
